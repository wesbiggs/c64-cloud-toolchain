# SPDX-License-Identifier: MIT
# Build the toolchain from source, check it, and publish it as the release
# asset setup.sh downloads. Runs when a tag v* is pushed; the tag must be
# setup.sh's RELEASE, which is what makes the script at that tag fetch the
# asset built from it. Run by hand, it builds and checks only, and keeps
# the tarball as the run's artifact.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASSET: c64-toolchain-ubuntu24.04-x86_64.tgz

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: The tag is setup.sh's release
        if: github.ref_type == 'tag'
        run: |
          release=$(sed -n 's/^RELEASE=//p' setup.sh)
          [ "$release" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME, but setup.sh says RELEASE=$release"
            exit 1
          }

      - name: Build cc65 and VICE from source
        run: sudo C64TC_FROM_SOURCE=1 ./setup.sh

      - name: Smoke test
        run: test/run.sh

      - name: Pack
        run: tar -czf "$ASSET" -C / opt/c64-toolchain

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: ${{ env.ASSET }}

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag \
                 --title "$GITHUB_REF_NAME" \
                 --notes "$(cat /opt/c64-toolchain/VERSION; echo; echo 'Built on ubuntu-24.04 into /opt/c64-toolchain.')"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber

  # A fresh runner fetches what was just published, as a cloud session
  # would, and runs the smoke test with it.
  verify:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up from the release
        run: sudo C64TC_FALLBACK=none ./setup.sh

      - name: Smoke test
        run: test/run.sh
