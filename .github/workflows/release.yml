# SPDX-License-Identifier: MIT
# Build the toolchain from source, check it, and publish it as the release
# asset setup.sh downloads, under setup.sh's RELEASE: the script at that
# tag fetches the asset built from it. Two ways to release: run this by
# hand on main with "publish" ticked (it creates the tag on the commit it
# built), or push the tag yourself (it must be RELEASE). Run by hand
# without "publish", it builds and checks only, and keeps the tarball as
# the run's artifact.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish setup.sh's RELEASE from this commit (main only)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASSET: c64-toolchain-ubuntu24.04-x86_64.tgz
  PUBLISH: ${{ github.ref_type == 'tag' || (inputs.publish && github.ref == 'refs/heads/main') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release: ${{ steps.release.outputs.release }}

    steps:
      - uses: actions/checkout@v5

      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(sed -n 's/^RELEASE=//p' setup.sh)
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but setup.sh says RELEASE=$release"
            exit 1
          fi
          # Run by hand, a release that is already out is not made again:
          # setup.sh's RELEASE wants moving on first.
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$PUBLISH" = true ] \
             && gh release view "$release" >/dev/null 2>&1; then
            echo "::error::$release is already released: move RELEASE in setup.sh on"
            exit 1
          fi

      - name: Build cc65 and VICE from source
        run: sudo C64TC_FROM_SOURCE=1 ./setup.sh

      - name: Smoke test
        run: test/run.sh

      - name: Pack
        run: tar -czf "$ASSET" -C / opt/c64-toolchain

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: ${{ env.ASSET }}

      # With a pushed tag the release goes on it; run by hand, gh makes the
      # tag on the commit this built. Given the file, gh makes a draft,
      # uploads it and only then publishes: releases here are immutable,
      # so nothing can be added once one is out.
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          gh release create "$RELEASE" "$ASSET" --target "$GITHUB_SHA" \
            --title "$RELEASE" \
            --notes "$(cat /opt/c64-toolchain/VERSION; echo; echo 'Built on ubuntu-24.04 into /opt/c64-toolchain.')"

  # A fresh runner fetches what was just published, as a cloud session
  # would, and runs the smoke test with it.
  verify:
    needs: build
    if: github.ref_type == 'tag' || (inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.release }}

      - name: Set up from the release
        run: sudo C64TC_FALLBACK=none ./setup.sh

      - name: Smoke test
        run: test/run.sh
